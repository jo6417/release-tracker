# 캘린더만 자주 갱신하는 가벼운 워크플로.
#
# 무거운 것(스팀·가격·알림)은 daily.yml에 그대로 두고, 여기서는
# 노션을 읽어 .ics를 만드는 일만 한다. 그래서 5분마다 돌려도 부담이 없다.
#
# make_ics.py의 DTSTAMP가 노션 수정시각을 쓰므로, 데이터가 그대로면
# 파일도 바이트 단위로 같다 → 커밋이 생기지 않고 Pages 재배포도 없다.
name: 캘린더 갱신

on:
  schedule:
    # 적어둔 주기의 15%만 지켜진다 (2026-08-22 실측: 100건 평균 33분 간격,
    # 최대 103분, 10분 이하는 0회). GitHub 예약은 보장이 아니라 여유 있을 때
    # 돌려주는 것이라, 이 숫자를 낮춰도 실제 실행 횟수는 거의 그대로다.
    # 그래도 비용이 0이라 최대치로 적어둔다 -- 여유가 생기면 그만큼 가져간다.
    # 공식 최소 간격은 5분이므로 아래 값은 사실상 "가능한 한 자주"라는 뜻이다.
    - cron: "* * * * *"
  workflow_dispatch:          # 즉시 반영이 필요할 때 수동 실행
                              # (노션을 고친 직후 부르는 것이 정식 경로다)

permissions:
  contents: write

concurrency:
  group: calendar
  cancel-in-progress: true    # 밀려서 겹치면 최신 것만 남긴다

jobs:
  calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 캘린더(.ics) 생성
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python make_ics.py

      - name: 변경분만 커밋
        run: |
          git config user.name "release-tracker"
          git config user.email "noreply@github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "캘린더 변경 없음 — 커밋하지 않습니다"
            exit 0
          fi
          git commit -m "캘린더 갱신 $(date -u +%Y-%m-%dT%H:%MZ)"
          # daily.yml과 동시에 돌면 push가 밀릴 수 있어 재시도한다
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "push 재시도 $i"
            sleep 5
          done
          exit 1
