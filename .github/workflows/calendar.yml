# 캘린더(.ics)만 다시 만드는 가벼운 워크플로. 15초쯤 걸린다.
#
# 무거운 것(스팀·가격·알림)은 daily.yml에 그대로 두고, 여기서는
# 노션을 읽어 .ics를 만드는 일만 한다.
#
# 바뀐 게 없으면 파일이 바이트 단위로 같아서 커밋도 Pages 재배포도 생기지
# 않는다. 그 판정은 make_ics.py의 `keep_stamps`가 한다 — 캘린더에 보이는
# 값이 그대로인 이벤트는 DTSTAMP도 옛 값을 유지시킨다. 이것이 없으면
# 추적기가 `소개`나 `현재가`를 써넣기만 해도 노션 수정시각이 움직여서,
# 출시일이 그대로인데 커밋이 생긴다.
name: 캘린더 갱신

on:
  # 예약(schedule)을 아예 걷어냈다.
  #
  # 노션이 바뀌는 순간은 둘뿐이고, 둘 다 우리가 이미 아는 시점이다:
  #   1. 추적기가 도는 하루 두 번 -> 아래 workflow_run이 받는다
  #   2. 사람이 손으로 넣을 때    -> CLAUDE.md 규칙대로 수동 실행을 건다
  # 그래서 "혹시 바뀌었나"를 주기적으로 물어볼 이유가 없다.
  #
  # 물어보는 값이 비쌌다. 한때 매분으로 열어뒀더니(8-22) 요청은 288회/일에서
  # 1440회/일이 됐는데 실제 실행은 60회에서 멈췄고, 이후 5일에 걸쳐
  # 60 -> 39 -> 24 -> 3회로 깎였다. 무시당한 요청이 쌓이자 이 리포의 예약
  # 처리량 자체가 줄어든 것으로 보인다(GitHub이 판정 방식을 공개하지 않아
  # 확증은 아니다). 같은 줄에 선 daily.yml·evening.yml까지 끌려가서, 8-28
  # 아침 알림은 09:00이 아니라 17:11에, 저녁 브리핑은 다음날 06:08에 왔다.
  # 이제 이 리포가 GitHub에 거는 예약은 알림 두 건이 전부다.
  #
  # workflow_run은 예약이 아니라 "저 워크플로가 끝났다"는 사건이라 그 제한을
  # 받지 않는다. 실패로 끝나도 받는다 -- 중간까지 노션에 쓰고 죽었을 수 있고,
  # 어차피 바뀐 게 없으면 커밋도 배포도 생기지 않아 손해가 없다.
  workflow_run:
    workflows: ["매일 추적", "저녁 브리핑"]
    types: [completed]
  workflow_dispatch:          # 노션을 고친 직후 부르는 정식 경로

permissions:
  contents: write

concurrency:
  group: calendar
  cancel-in-progress: true    # 밀려서 겹치면 최신 것만 남긴다

jobs:
  calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 캘린더(.ics) 생성
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python make_ics.py

      - name: 변경분만 커밋
        run: |
          git config user.name "release-tracker"
          git config user.email "noreply@github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "캘린더 변경 없음 — 커밋하지 않습니다"
            exit 0
          fi
          git commit -m "캘린더 갱신 $(date -u +%Y-%m-%dT%H:%MZ)"
          # daily.yml과 동시에 돌면 push가 밀릴 수 있어 재시도한다
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "push 재시도 $i"
            sleep 5
          done
          exit 1
