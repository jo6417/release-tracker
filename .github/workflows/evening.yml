name: 저녁 브리핑

# 2026-09-25부터 아침·저녁은 같은 점검을 하루 두 번 하는 것이다(사용자 지시).
# 매번 "직전 점검 이후 바뀐 것"을 알린다 — 아침은 밤사이, 저녁은 낮 동안.
# 그래서 이 파일은 daily.yml을 slot=저녁으로 부르기만 한다. 점검 내용을
# 고칠 때는 daily.yml만 고치면 된다.
#
# 파일 이름과 `name:`은 그대로 둔다. Cloudflare Worker(release-tracker-waker)가
# 19:00에 이 파일을 workflow_dispatch로 깨우고, calendar.yml은 이 이름의
# 완료를 보고 캘린더를 다시 만든다.
#
# 예전 저녁 전용 단계(briefing.py 단독 실행, 저녁 기록 커밋)는 없어졌다.
# 브리핑은 track.py가 아침·저녁 모두 붙이고, 커밋은 daily.yml이 한다.

on:
  # ── 예약 중단 (2026-09-06) — 외부 Worker가 깨운다. 예약을 살리면 두 번 돈다
  # schedule:
  #   - cron: "0 10 * * *"      # 19:00 KST (UTC 10:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evening:
    uses: ./.github/workflows/daily.yml
    with:
      slot: 저녁
    secrets: inherit
