name: 매일 추적

on:
  # ── 예약 중단 (2026-09-06) ───────────────────────────────────────────
  # GitHub 예약이 2~8시간씩 밀려서 Cloudflare Worker(release-tracker-waker)가
  # 정시에 workflow_dispatch 로 깨우는 방식으로 옮겼다. 아래 예약을 살려두면
  # 외부 호출과 예약이 각각 돌아 알림 카드가 하루 두 배로 나간다.
  # 되돌리려면 아래 두 줄 앞의 '# ' 만 지우면 된다.
  # schedule:
  #   - cron: "0 0 * * *"      # 09:00 KST (UTC 00:00)
  workflow_dispatch:          # 수동 실행 버튼

permissions:
  contents: write             # 스냅샷 커밋용

jobs:
  track:
    runs-on: ubuntu-latest
    # 카드를 만드는 스크립트가 셋(가격·트레일러·변화)이라 예전에는 아침에만
    # 알림이 3장 왔다. 이 변수가 있으면 각 스크립트는 보내지 않고 모아두고,
    # 마지막 스텝이 한 장으로 합쳐 보낸다.
    env:
      NOTIFY_SPOOL: notify_spool.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 스팀 라이브러리 동기화
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: python sync_steam.py
        continue-on-error: true      # 한 소스가 죽어도 추적은 계속

      - name: 가격 추적 (ITAD)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python sync_prices.py
        continue-on-error: true

      # sync_series는 방영 시작 이후(완결)를 본다. 이쪽은 그 앞 구간 —
      # 아직 안 나온 것의 출시일. track.py는 노션의 변화만 보므로,
      # 바깥 발표를 노션에 먼저 실어주는 이 단계가 track.py 앞에 있어야 한다.
      # 채팅으로 노션에 직접 추가한 작품은 외부ID가 빈 채로 남는다. 그 상태로는
      # 가격 추적도, 출시일 재조회도, 완결 추적도 그 행을 못 본다 - 아래 단계들이
      # 전부 외부ID를 입구로 쓰기 때문이다. 그래서 재조회보다 앞에 두어, 이번
      # 주에 붙은 ID가 같은 실행에서 바로 쓰이게 한다.
      #
      # 매칭은 전 행을 훑어 느리고 매일 할 이유도 없어 일요일에만 돈다.
      # apply 쪽은 비어 있는 칸만 채우므로 손으로 넣은 값을 덮지 않는다.
      - name: 주간 매칭 (일요일)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          if [ "$(date -u +%u)" != "7" ]; then
            echo "일요일이 아니다 - 건너뜀"
            exit 0
          fi
          python match_igdb.py
          python apply_igdb.py
          python match_tmdb.py
          python apply_tmdb_ids.py
        continue-on-error: true

      - name: 출시일 재조회 (IGDB·TMDB)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python refresh_dates.py
        continue-on-error: true

      - name: 시리즈 완결 추적 (TMDB)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python sync_series.py
        continue-on-error: true

      # 빈 것부터 조금씩 채운다. 매일 밀면 새로 들어온 작품이 알아서 붙는다
      - name: 작품 소개 채우기
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python sync_intro.py --limit 120
        continue-on-error: true

      - name: 새 트레일러 감지
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python sync_media.py
        continue-on-error: true

      # 게임패스 입점·이탈. 인증이 필요 없는 공개 엔드포인트라 시크릿이 없다.
      # track.py 앞에 두어 같은 아침 카드에 실린다.
      - name: 게임패스 입점·이탈 감지
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python sync_gamepass.py
        continue-on-error: true

      # 게임쇼(다이렉트·State of Play 등)에서 공개된 관심작 감지. IGDB가
      # 사후 등록형이라 지난 며칠치만 보면 되고, 매일 돌아도 겹치는 걸
      # 외부ID로 걸러 중복 생성하지 않는다.
      - name: 게임쇼 관심작 감지
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python sync_events.py
        continue-on-error: true

      # 닌텐도 다이렉트·State of Play·Xbox 쇼케이스는 IGDB에 잡히기 전에
      # 유튜브 "예정된 라이브"로 먼저 안다 — 방송 며칠 전에 미리 알린다.
      - name: 게임쇼 사전 예고 감지
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python sync_upcoming_shows.py
        continue-on-error: true

      # 하드웨어(스위치2 젤다 에디션 등)는 IGDB·TMDB 어디에도 없어 출시일을
      # 자동 확인할 수단이 없다. 뉴스로 대신 감지만 하고 반영은 사람이 한다.
      - name: 하드웨어·메이저 게임쇼 뉴스 감지
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NAVER_API_KEY_ID: ${{ secrets.NAVER_API_KEY_ID }}
          NAVER_API_KEY: ${{ secrets.NAVER_API_KEY }}
        run: python sync_hardware_news.py
        continue-on-error: true

      # 국내 택배로 넘어온 주문만 매일 확인. 도착하면 자동으로 구매 완료
      # 처리해 사람이 "받았어"라고 말할 필요를 없앤다.
      - name: 배송 추적 (스마트택배)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SWEETTRACKER_API_KEY: ${{ secrets.SWEETTRACKER_API_KEY }}
        run: python sync_delivery.py
        continue-on-error: true

      - name: 변화 감지 및 알림
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python track.py

      # refresh_dates.py 등이 confirm_queue.json에 쌓아둔 "반영할까요?"를
      # 하루 한 장으로 알린다. 답이 없으면 다음날도 그대로 다시 뜬다.
      - name: 확인 큐 알림
        run: python notify_confirm_queue.py
        continue-on-error: true

      # 매월 1일에만 실제로 보낸다 (heartbeat.py가 날짜를 스스로 판단)
      - name: 월 1회 생존 신호
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python heartbeat.py

      # 앞 스텝들이 모아둔 것을 한 장으로 보낸다.
      # if: always() — 앞이 하나 죽어도 나머지는 알려야 한다
      - name: 알림 한 장으로 보내기
        if: always()
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python notify.py --flush
        continue-on-error: true

      - name: 스냅샷 커밋
        run: |
          git config user.name "release-tracker"
          git config user.email "noreply@github.com"
          # media_state.json은 어떤 트레일러를, refresh_state.json은 어떤 연기를
          # 이미 알렸는지 기억한다.
          # 커밋하지 않으면 러너가 매번 빈 상태로 시작해 첫 실행 취급이 되고,
          # 그러면 새 영상을 영원히 못 잡는다 (기준값만 다시 잡는다).
          git add snapshots/ media_state.json youtube_watch.json refresh_state.json candidates.json
          git add igdb_match.json tmdb_match.json game_title_en.json steam_map.json
          git add gamepass_state.json gamepass_map.json
          git add hardware_news_state.json
          # 처음 생기기 전까지는 파일이 없다 — 없으면 git add가 실패해서
          # bash -e 때문에 이 스텝 전체가 죽는다. 있을 때만 더한다.
          for f in sweettracker_key.json confirm_queue.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --staged --quiet; then
            echo "스냅샷 변경 없음"
            exit 0
          fi
          git commit -m "스냅샷 $(date +%Y-%m-%d)"
          # calendar.yml과 동시에 돌면 push가 밀릴 수 있어 재시도한다
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "push 재시도 $i"
            sleep 5
          done
          exit 1
